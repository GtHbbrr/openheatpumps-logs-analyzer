<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenHeatPumps - OpenQuatt AI Diagnose</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans">
    <header class="border-b border-gray-800 bg-gray-950 p-4 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-orange-500 tracking-wide">OpenHeatPumps <span class="text-xs text-gray-400 font-normal">AI Analytics MVP</span></h1>
            <span class="bg-orange-950 text-orange-400 border border-orange-800 text-xs px-2 py-1 rounded">OpenQuatt Setup v0.50</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Links: Kenmerken -->
        <div class="md:col-span-1 bg-gray-950 border border-gray-800 p-6 rounded-lg shadow-xl space-y-6">
            <div>
                <h2 class="text-lg font-semibold mb-4 text-gray-200">1. Systeemkenmerken</h2>
                <div class="space-y-4">
                    <div><label class="block text-xs text-gray-400 font-medium mb-1">Woningtype</label>
                        <select id="woning_type" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-gray-300 focus:outline-none focus:border-orange-500"><option value="tussenwoning">Tussenwoning</option><option value="vrijstaand">Vrijstaand</option><option value="hoekwoning">Hoekwoning</option></select></div>
                    <div><label class="block text-xs text-gray-400 font-medium mb-1">Afgiftesysteem</label>
                        <select id="afgiftesysteem" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-gray-300 focus:outline-none focus:border-orange-500"><option value="radiatoren">Radiatoren</option><option value="vloerverwarming">Vloerverwarming</option><option value="fancoils">Fancoils / Jaga</option></select></div>
                    <div><label class="block text-xs text-gray-400 font-medium mb-1">CV-Ketel Merk</label>
                        <select id="cv_ketel" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-gray-300 focus:outline-none focus:border-orange-500"><option value="Intergas">Intergas</option><option value="Remeha">Remeha</option><option value="Vaillant">Vaillant</option></select></div>
                    <div><label class="block text-xs text-gray-400 font-medium mb-1">Thermostaat</label>
                        <select id="thermostaat" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-gray-300 focus:outline-none focus:border-orange-500"><option value="Nest">Google Nest</option><option value="Tado">Tado</option><option value="Honeywell">Honeywell Home</option></select></div>
                </div>
            </div>
            <div class="border-t border-gray-800 pt-6">
                <h2 class="text-lg font-semibold mb-3 text-gray-200">2. Logboek Koppelen</h2>
                <button id="btn-map" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-medium p-3 rounded transition shadow-lg text-sm">📂 Koppel Log-map</button>
                <p id="map-status" class="text-xs text-gray-500 mt-2 text-center">Nog geen map gekoppeld</p>
            </div>
        </div>

        <!-- Rechts: Console & Chat -->
        <div class="md:col-span-2 flex flex-col space-y-6">
            <div id="drop-zone" class="border-2 border-dashed border-gray-800 bg-gray-950 p-6 rounded-lg text-center hover:border-orange-500 transition cursor-pointer">
                <p class="text-sm text-gray-400">Gekoppeld logboek: <span id="file-name" class="text-orange-400 font-medium">Geen bestand geladen</span></p>
                <p class="text-xs text-gray-600 mt-1">Of sleep je .oqdebug.json handmatig hiernaartoe</p>
            </div>

            <button id="btn-diagnose" disabled class="w-full bg-green-700 opacity-50 cursor-not-allowed text-white font-bold p-4 rounded-lg shadow-lg text-base transition duration-200">Start AI Systeem Analyse</button>

            <div class="bg-gray-950 border border-gray-800 rounded-lg p-6 flex-1 flex flex-col shadow-2xl">
                <h3 class="text-md font-semibold text-gray-400 mb-4 pb-2 border-b border-gray-800 flex justify-between">
                    <span>AI Analyse Console</span><span id="loader" class="hidden text-orange-400 animate-pulse text-xs">AI denkt na...</span>
                </h3>
                <div id="output-box" class="text-sm leading-relaxed text-gray-300 space-y-4 max-h-[400px] overflow-y-auto pr-2 whitespace-pre-line">De resultaten verschijnen hier na de scan...</div>
                <div id="chat-container" class="hidden mt-6 pt-4 border-t border-gray-800 flex gap-2">
                    <input type="text" id="chat-input" placeholder="Stel een vervolgvraag..." class="flex-1 bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm focus:outline-none focus:border-orange-500 text-gray-200">
                    <button id="btn-send" class="bg-orange-600 hover:bg-orange-700 px-5 py-3 rounded-lg text-sm font-semibold transition">Verstuur</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const WORKER_URL = "https://openheatpumps-backend.g358xh.workers.dev/";
        let activeLogData = null, chatHistory = [];

        const el = id => document.getElementById(id);
        
        el('btn-map').addEventListener('click', async () => {
            try {
                const dir = await window.showDirectoryPicker();
                el('map-status').textContent = "Verbonden: " + dir.name;
                for await (const entry of dir.values()) {
                    if (entry.kind === 'file' && entry.name.endsWith('.json')) {
                        laadBestand(await entry.getFile());
                        return;
                    }
                }
            } catch (err) { alert("Gebruik Drag & Drop."); }
        });

        el('drop-zone').addEventListener('dragover', e => e.preventDefault());
        el('drop-zone').addEventListener('drop', e => { e.preventDefault(); if(e.dataTransfer.files.length) laadBestand(e.dataTransfer.files[0]); });

        async function laadBestand(file) {
            el('file-name').textContent = file.name;
            activeLogData = JSON.parse(await file.text());
            el('btn-diagnose').disabled = false;
            el('btn-diagnose').classList.remove('opacity-50', 'cursor-not-allowed');
            el('btn-diagnose').classList.add('hover:bg-green-600');
        }

        el('btn-diagnose').addEventListener('click', async () => {
            if (!activeLogData) return;
            el('loader').classList.remove('hidden');
            el('output-box').textContent = "Systeemanalyse wordt gegenereerd...";
            chatHistory = [];

            const profile = { woning_type: el('woning_type').value, afgiftesysteem: el('afgiftesysteem').value, cv_ketel: el('cv_ketel').value, thermostaat: el('thermostaat').value };

            try {
                const r = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userProfile: profile, logData: activeLogData, messages: null }) });
                const d = await r.json();
                el('output-box').innerHTML = `<strong>Analyse Resultaat:</strong>\n\n${d.diagnose}`;
                chatHistory.push({ role: "user", parts: [{ text: "Analyseer dit bestand." }] }, { role: "model", parts: [{ text: d.diagnose }] });
                el('chat-container').classList.remove('hidden');
            } catch (err) { el('output-box').textContent = "Fout: " + err.message; }
            el('loader').classList.add('hidden');
        });

        async function verstuurVraag() {
            const v = el('chat-input').value.trim(); if (!v) return;
            el('chat-input').value = "";
            el('output-box').innerHTML += `\n\n<span class="text-orange-400"><strong>Jij:</strong> ${v}</span>`;
            el('loader').classList.remove('hidden');
            chatHistory.push({ role: "user", parts: [{ text: v }] });

            try {
                const r = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: chatHistory, logData: null, userProfile: {} }) });
                const d = await r.json();
                el('output-box').innerHTML += `\n\n<strong>AI Assistent:</strong>\n${d.diagnose}`;
                chatHistory.push({ role: "model", parts: [{ text: d.diagnose }] });
                el('output-box').scrollTop = el('output-box').scrollHeight;
            } catch (err) { el('output-box').innerHTML += `\n\n<span class="text-red-500"><strong>Fout.</strong></span>`; }
            el('loader').classList.add('hidden');
        }

        el('btn-send').addEventListener('click', verstuurVraag);
        el('chat-input').addEventListener('keypress', e => { if (e.key === 'Enter') verstuurVraag(); });
    </script>
</body>
</html>
