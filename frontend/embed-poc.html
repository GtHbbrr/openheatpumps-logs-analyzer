<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenQuatt SPA + AI Sideframe PoC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
</head>
<body class="bg-gray-900 text-white h-screen overflow-hidden flex flex-col">
  <div class="bg-gray-950 border-b border-gray-800 px-4 py-2 flex flex-wrap items-center justify-between gap-3 text-xs z-20">
    <div class="flex items-center gap-3">
      <span class="font-bold text-orange-500 text-sm">OpenQuatt SPA + AI Sideframe PoC</span>
      <span id="poc-status" class="text-gray-400">⏳ Demo-log ophalen uit OpenQuatt SPA...</span>
      <label class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-2.5 py-1 rounded cursor-pointer border border-gray-700">
        📂 Eigen .oqdebug.json
        <input type="file" id="poc-file" accept=".json" class="hidden">
      </label>
    </div>
    <div class="flex items-center gap-2">
      <span id="nav-badge" class="hidden text-green-400 bg-green-950/60 border border-green-800 px-2 py-0.5 rounded font-mono"></span>
      <button id="toggle-drawer" class="bg-orange-600 hover:bg-orange-500 text-white px-3 py-1 rounded font-semibold shadow">
        ✨ AI Hulp sluiten
      </button>
    </div>
  </div>

  <div class="flex-1 flex overflow-hidden">
    <iframe
      id="oq-demo-frame"
      src="./oq-demo/dev.html?view=overview"
      class="flex-1 h-full border-0 bg-white"
      title="OpenQuatt Web-App Demo">
    </iframe>

    <aside id="ai-drawer" class="border-l border-gray-800 bg-gray-950 flex-shrink-0 h-full" style="width: 460px; max-width: 100vw;">
      <iframe id="ai-frame" src="./?embed=1" class="w-full h-full border-0" title="OpenQuatt AI Assistent"></iframe>
    </aside>
  </div>

  <script>
    const OQ_DEMO_BASE = './oq-demo/dev.html';
    const oqFrame = document.getElementById('oq-demo-frame');
    const aiFrame = document.getElementById('ai-frame');
    const drawer = document.getElementById('ai-drawer');
    const toggleBtn = document.getElementById('toggle-drawer');
    const statusEl = document.getElementById('poc-status');
    const navBadge = document.getElementById('nav-badge');
    let cachedLog = null;
    let aiReady = false;

    toggleBtn.addEventListener('click', () => {
      const hidden = drawer.classList.toggle('hidden');
      toggleBtn.textContent = hidden ? '✨ AI Hulp openen' : '✨ AI Hulp sluiten';
    });

    function sendLogToAi(label) {
      if (!cachedLog || !aiReady || !aiFrame.contentWindow) return;
      aiFrame.contentWindow.postMessage({
        type: 'OQ_LOGDATA',
        logData: cachedLog,
        userProfile: {
          woning_type: 'tussenwoning',
          afgiftesysteem: 'alleen radiatoren',
          cv_ketel: 'Intergas',
          thermostaat: 'Honeywell'
        }
      }, '*');
      statusEl.textContent = label || '✅ Live demo-log gekoppeld aan AI-zijpaneel';
      statusEl.className = 'text-green-400 font-medium';
    }

    async function loadDemoLogFromSpa() {
      for (let attempt = 0; attempt < 15; attempt++) {
        try {
          const win = oqFrame.contentWindow;
          if (win && typeof win.fetch === 'function') {
            const res = await win.fetch('/openquatt/debug-recording/download?last_minutes=15');
            if (res && res.ok) {
              const data = await res.json();
              if (data && Array.isArray(data.samples) && data.samples.length > 0) {
                cachedLog = data;
                sendLogToAi('✅ Live OpenQuatt demo-log (15 min) gekoppeld');
                return;
              }
            }
          }
        } catch (_) {}
        await new Promise(r => setTimeout(r, 400));
      }
    }

    oqFrame.addEventListener('load', () => {
      if (!cachedLog) loadDemoLogFromSpa();
    });

    document.getElementById('poc-file').addEventListener('change', async (e) => {
      const files = e.target.files;
      if (!files || !files.length) return;
      cachedLog = JSON.parse(await files.item(0).text());
      sendLogToAi('✅ Eigen logbestand actief in AI-zijpaneel');
    });

    window.addEventListener('message', (event) => {
      const msg = event.data;
      if (!msg || typeof msg !== 'object') return;
      if (msg.type === 'OQ_EMBED_READY') {
        aiReady = true;
        sendLogToAi();
      } else if (msg.type === 'OQ_NAVIGATE' && typeof msg.href === 'string') {
        const qIndex = msg.href.indexOf('?');
        const query = qIndex >= 0 ? msg.href.slice(qIndex) : '?view=overview';
        oqFrame.src = OQ_DEMO_BASE + query;
        navBadge.textContent = 'Navigeer -> ' + query;
        navBadge.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
