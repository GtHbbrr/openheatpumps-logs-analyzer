<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><title>OpenQuatt AI Sideframe PoC</title><link rel="stylesheet" href="https://cloudflare.com"></head>
<body class="bg-gray-900 text-white h-screen overflow-hidden flex flex-col">
<div class="bg-gray-950 border-b border-gray-800 px-4 py-2 flex items-center justify-between text-xs">
  <div class="flex items-center gap-3"><span class="font-bold text-orange-500">OpenQuatt SPA + AI Sideframe PoC</span><label class="bg-gray-800 hover:bg-gray-700 px-2.5 py-1 rounded cursor-pointer border border-gray-700">📂 Laad .oqdebug.json<input type="file" id="f" accept=".json" class="hidden"></label><span id="st" class="text-gray-400">Kies een logbestand</span></div>
  <div class="flex items-center gap-2"><span id="nb" class="hidden text-green-400 font-mono"></span><button id="tg" class="bg-orange-600 px-3 py-1 rounded font-semibold">✨ AI Hulp sluiten</button></div>
</div>
<div class="flex-1 flex overflow-hidden">
  <iframe id="oq" src="https://github.io?view=overview" class="flex-1 h-full border-0"></iframe>
  <aside id="dr" class="border-l border-gray-800 bg-gray-950 flex-shrink-0" style="width:440px"><iframe id="ai" src="./?embed=1" class="w-full h-full border-0"></iframe></aside>
</div>
<script>
const oq = document.getElementById('oq'), ai = document.getElementById('ai'), dr = document.getElementById('dr'), tg = document.getElementById('tg');
let log = null;
tg.onclick = () => { const h = dr.classList.toggle('hidden'); tg.textContent = h ? '✨ AI Hulp openen' : '✨ AI Hulp sluiten'; };
function send(){ if(log && ai.contentWindow){ ai.contentWindow.postMessage({type:'OQ_LOGDATA',logData:log,userProfile:{woning_type:'tussenwoning',afgiftesysteem:'alleen radiatoren',cv_ketel:'Intergas',thermostaat:'Honeywell'}},'*'); document.getElementById('st').textContent='✅ Log actief in AI'; } }
document.getElementById('f').onchange = async e => { if(e.target.files){ log = JSON.parse(await e.target.files.text()); send(); } };
window.onmessage = e => { if(e.data?.type==='OQ_EMBED_READY') send(); if(e.data?.type==='OQ_NAVIGATE'){ const u = e.data.href.replace(/^http:\/\/openquatt\.local\//i,'https://github.io'); oq.src = u; const nb = document.getElementById('nb'); nb.textContent = u.replace('https://github.io',''); nb.classList.remove('hidden'); } };
</script></body></html>
