name = "openheatpumps-backend"
main = "backend/backend_index.js"
compatibility_date = "2024-03-01"

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[[rules]]
type = "Text"
globs = ["**/*.txt"]

[triggers]
# TIJDELIJKE AANPASSING: Extra trigger toegevoegd om iedere 5 minuten te testen
crons = [ 
  "0 3 * * *",   # Standaard dagelijkse synchronisatie om 03:00 uur UTC
  "*/5 * * * *",   # tijdelijk voor testen iedere 5 minuten synchronisatie
]

