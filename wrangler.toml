name = "openheatpumps-backend"
main = "backend/backend_index.js"
compatibility_date = "2024-03-01"

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[[vectorize]]
binding = "VECTOR_INDEX"
index_name = "openquatt-docs-preview"

# GECORRIGEERD: Enkele haken in plaats van dubbele haken voor de AI-configuratie[1.5]
[ai]
binding = "AI"

[triggers]
# TIJDELIJKE AANPASSING: Extra triggers toegevoegd voor 14:36 uur (zowel UTC als lokaal) om over 2 minuten te testen
crons = [ 
  "0 3 * * *",   # Standaard dagelijkse synchronisatie om 03:00 uur UTC
  "37 14 * * *", # TIJDELIJK: Activeert de ingestie-motor vandaag om exact 14:36 uur
  "37 13 * * *"  # TIJDELIJK: Fallback trigger (indien de Cloudflare-omgeving op pure UTC-tijd draait)
]

