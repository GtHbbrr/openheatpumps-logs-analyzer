# ==============================================================================
# OVERZICHT VAN DE AUTOMATISERING (GITHUB -> CLOUDFLARE WORKER)
# ==============================================================================
# 1. Start GitHub Action (00:17 UTC = 01:17 wintertijd / 02:17 zomertijd NL):
#    Minuut 17 is gekozen om piekdrukte en lange wachtrijen op GitHub te vermijden.
# 2. Docs ophalen & opslaan:
#    Het script 'fetch-docs.js' ververst 'backend/openquatt_docs_snapshot.txt'.
# 3. Automatische uitrol (Deploy) naar Cloudflare:
#    Bij wijzigingen pusht deze workflow de nieuwe versie naar de 'main'-branch.
#    Cloudflare Workers detecteert deze commit en bouwt automatisch een nieuwe
#    versie met het bijgewerkte .txt-bestand (via de [[rules]] in wrangler.toml).
# 4. Dagelijkse controle in Cloudflare (03:00 UTC = 04:00 / 05:00 uur NL):
#    De cron in Cloudflare draait ruim twee uur later, zodat de nieuwe build
#    altijd op tijd live staat voor de dagelijkse synchronisatie.
# ======name: Dagelijkse Docs Update

on:
  schedule:
    # Start elke nacht om 00:17 UTC (01:17 wintertijd / 02:17 zomertijd in NL)
    - cron: '17 0 * * *'
  workflow_dispatch:

jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Installeer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Haal OpenQuatt docs op en compileer snapshot
        run: node fetch-docs.js

      - name: Commit bijgewerkte snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/openquatt_docs_snapshot.txt
          if git diff --cached --quiet; then
            echo "Geen wijzigingen — snapshot is al up-to-date."
          else
            git commit -m "docs: dagelijkse OpenQuatt snapshot update"
            git push
          fi
